[package]
name = "mitra_services"
version.workspace = true
license.workspace = true

edition.workspace = true
rust-version.workspace = true

publish.workspace = true

[dependencies]
# Used for catching errors
anyhow = "1.0.58"
# Used for working with dates
chrono = { version = "0.4.34", default-features = false, features = ["std"] }
# Used for working with ethereum addresses
ethereum-types = { version = "0.15.1", default-features = false }
# Used to work with hexadecimal strings
hex = { version = "0.4.3", features = ["serde"] }
# Used for logging
log = "0.4.20"
# Used to work with Monero addresses
monero = "0.22.0"
# Used to work with monero-wallet-rpc
monero-rpc = { git = "https://github.com/silverpill/monero-rpc-rs", rev = "9e4192163abf806731226423624b9388c7417824", default-features = false, features = ["rpc_authentication", "rustls-tls-no-provider"] }
# Used to work with monero-lws API
monero-lws = { git = "https://github.com/silverpill/monero-lws-rs", rev = "9bf190a95732118af76ff0a897eba7567d6530f4" }
# Used for working with regular expressions
regex = "1.10.6"
# Used for making async HTTP requests
# Requires quinn even if http3 is disabled: https://github.com/seanmonstar/reqwest/issues/2318
reqwest = { version = "0.13.3", default-features = false, features = ["json", "query", "multipart"] }
# Used for serialization/deserialization
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
# Used to verify EIP-4361 signatures
siwe = "0.6.0"
# Used for creating error types
thiserror = "2.0.18"

apx_core = { path = "../apx_core" }
mitra_config = { path = "../mitra_config" }
mitra_models = { path = "../mitra_models" }
mitra_utils = { path = "../mitra_utils" }

[features]
test-utils = []

[lints]
workspace = true
