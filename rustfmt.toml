# Usage:
# cargo fmt -- --config imports_layout=Vertical,trailing_comma=Vertical,force_multiline_blocks=true --check
#
# NOTE: the code in this project is not formatted with rustfmt

chain_width = 50
fn_call_width = 50
max_width = 80
match_block_trailing_comma = true
reorder_imports = false
struct_lit_width = 40

# Nightly
force_multiline_blocks = true
imports_layout = "Vertical"
trailing_comma = "Vertical"

# Semicolon after `for` ? https://github.com/rust-lang/rustfmt/issues/4222
# Preserve trailing semicolons https://github.com/rust-lang/rustfmt/pull/6149
# Don't break await https://github.com/rust-lang/rustfmt/issues/6715
# Function arguments per line https://github.com/rust-lang/rustfmt/issues/4306
# Underindented chains https://github.com/rust-lang/rustfmt/issues/3157
